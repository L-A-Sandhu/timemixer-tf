name: CI

on:
  push:
    branches: [main]
    paths: ['timemixer_tf/**', 'pyproject.toml', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
    paths: ['timemixer_tf/**', 'pyproject.toml']

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check timemixer_tf/

      - name: Format check with black
        run: black --check --line-length 100 timemixer_tf/

      - name: Run tests
        run: python -m pytest timemixer_tf/test_equivalence.py -v --tb=short

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          pip install build
          python -m build
      - name: Check wheel
        run: |
          pip install twine
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
