name: CI

on:
  push:
    branches: [main]
    paths: ['timemixer_tf/**', 'pyproject.toml', '.github/workflows/ci.yml']
  pull_request:
    branches: [main]
    paths: ['timemixer_tf/**', 'pyproject.toml']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check timemixer_tf/

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
